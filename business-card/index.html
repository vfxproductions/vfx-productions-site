<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>VFX · Augmented Logo</title>

<!-- Import map MUST come before ANY module script, or the browser ignores it
     (which would break the bare "three" imports below and kill the whole script). -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<!-- model-viewer: native AR (iOS Quick Look / Android Scene Viewer / WebXR) -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 35%, #0c0c0c 0%, #000 65%);
    color:#fff;font-family:"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* Camera feed (a normal element — NOT behind any opaque background). */
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
  /* Transparent WebGL canvas, composited on top of the feed. */
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}

  /* ---------- overlay layers ---------- */
  .layer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px;
    transition:opacity .5s ease, visibility .5s ease}
  .layer.hidden{opacity:0;visibility:hidden;pointer-events:none}

  .mark{width:min(60vw,360px);height:auto;display:block;
    filter:drop-shadow(0 2px 34px rgba(255,255,255,.12))}
  .tagline{margin:18px 0 0;font-size:clamp(10px,2.6vw,13px);letter-spacing:.55em;
    text-transform:uppercase;color:#9a9a9a;padding-left:.55em}
  .lede{margin:26px auto 0;max-width:30ch;font-size:14px;line-height:1.6;color:#cfcfcf}
  .btn{appearance:none;cursor:pointer;border:1px solid #fff;background:transparent;color:#fff;
    font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    padding:15px 30px;border-radius:40px;transition:.25s ease}
  .btn:hover{background:#fff;color:#000}
  .actions{margin-top:36px;display:flex;flex-direction:column;gap:13px;align-items:center}
  .btn.ghost{border-color:#444;color:#bdbdbd;padding:13px 26px}
  .btn.ghost:hover{border-color:#fff;color:#fff;background:transparent}
  .arnote{margin-top:16px;font-size:11px;letter-spacing:.08em;color:#777;min-height:1em}

  .foot{position:fixed;bottom:20px;left:0;right:0;z-index:6;text-align:center;
    font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#6a6a6a}

  /* hint while AR is live */
  #hint{position:fixed;left:0;right:0;bottom:74px;z-index:6;text-align:center;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#fff;
    text-shadow:0 1px 14px rgba(0,0,0,.85);opacity:0;transition:opacity .5s;pointer-events:none}
  #hint.show{opacity:1}

  /* top bar during AR */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:none;
    justify-content:space-between;align-items:center;padding:18px 20px}
  #topbar.show{display:flex}
  .close{appearance:none;cursor:pointer;background:rgba(0,0,0,.35);border:1px solid #444;color:#fff;
    width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1;backdrop-filter:blur(6px)}
  .close:hover{border-color:#fff}
  .cta{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    background:rgba(0,0,0,.35);border:1px solid #fff;color:#fff;border-radius:40px;
    padding:11px 20px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;backdrop-filter:blur(6px);transition:.25s}
  .cta:hover{background:#fff;color:#000}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
    max-width:88vw;background:#111;border:1px solid #333;color:#eee;border-radius:10px;
    padding:12px 16px;font-size:13px;line-height:1.5;display:none}
  #toast.show{display:block}

  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#bbb;display:none}
  #loading.show{display:block}
</style>
</head>
<body>
  <!-- Live camera feed (proven approach) -->
  <video id="cam" autoplay muted playsinline></video>
  <!-- Logo, rendered transparent on top -->
  <canvas id="gl"></canvas>

  <!-- Native AR launcher (placed on a real surface via the OS). Kept invisible;
       triggered by the "Place it on your table" button. -->
  <model-viewer id="mv"
    src="./assets/logo_ar.glb"
    ios-src="./assets/logo_ar.usdz"
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed"
    loading="eager" reveal="auto" interaction-prompt="none"
    style="position:fixed;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:-1"></model-viewer>

  <!-- TOP BAR -->
  <div id="topbar">
    <button class="close" id="closeBtn" aria-label="Close">×</button>
    <a class="cta" id="siteBtn" href="https://vfx.productions" target="_blank" rel="noopener">See our work&nbsp;↗</a>
  </div>

  <!-- INTRO -->
  <section id="intro" class="layer">
    <img class="mark" src="./assets/logo.png" alt="VFX" />
    <p class="tagline">Vision&nbsp;For&nbsp;Xperiences</p>
    <p class="lede">Drop the studio mark into your space — place it on a table or floor and walk around it.</p>
    <div class="actions">
      <button class="btn" id="tableBtn">Place it on your table&nbsp;→</button>
      <button class="btn ghost" id="launchBtn">View over camera</button>
    </div>
    <p class="arnote" id="arnote"></p>
  </section>

  <div class="foot" id="foot">vfx.productions</div>
  <div id="hint">Move your phone around the logo</div>
  <div id="loading">Loading logo…</div>
  <div id="toast"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const intro   = document.getElementById('intro');
    const foot    = document.getElementById('foot');
    const hint    = document.getElementById('hint');
    const topbar  = document.getElementById('topbar');
    const toast   = document.getElementById('toast');
    const loading = document.getElementById('loading');
    const camEl   = document.getElementById('cam');

    const show = (el) => el.classList.add('show');
    const hideC = (el) => el.classList.remove('show');
    function flash(msg, ms){ toast.textContent = msg; toast.classList.add('show'); if(ms) setTimeout(()=>toast.classList.remove('show'), ms); }

    /* ---------- Three.js: transparent canvas, lit rotating logo ---------- */
    const canvas = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);                 // fully transparent — feed shows through
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 100);
    camera.position.set(0, 0, 5);

    // Studio-style reflections so the metallic logo reads well.
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 2.5); scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fb8ff, 1.1); rim.position.set(-2.5, -1, -2); scene.add(rim);

    const pivot = new THREE.Group();   // turntable
    scene.add(pivot);
    let radius = 1;

    loading.classList.add('show');
    // Reuse the AR-ready model (already upright, facing the camera) — one download, shared with model-viewer.
    new GLTFLoader().load('./assets/logo_ar.glb', (gltf) => {
      const logo = gltf.scene;
      const box = new THREE.Box3().setFromObject(logo);
      const center = box.getCenter(new THREE.Vector3());
      logo.position.sub(center);           // center at origin; pivot spins it
      pivot.add(logo);
      radius = box.getBoundingSphere(new THREE.Sphere()).radius || 1;
      frameCamera();
      loading.classList.remove('show');
    }, undefined, (err) => { console.error(err); loading.textContent = 'Could not load logo'; });

    // Fit the logo in view for any screen aspect (portrait & landscape).
    function frameCamera(){
      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const hFOV = 2 * Math.atan(Math.tan(vFOV/2) * camera.aspect);
      const fov = Math.min(vFOV, hFOV);
      camera.position.z = (radius / Math.sin(fov/2)) * 1.3;
      camera.updateProjectionMatrix();
    }

    function resize(){
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      renderer.setSize(w, h, false);
      frameCamera();
    }
    window.addEventListener('resize', resize);
    resize();

    let last = 0;
    function animate(t){
      requestAnimationFrame(animate);
      const dt = (t - last) || 16; last = t;
      pivot.rotation.y += dt * 0.0006;
      pivot.position.y = Math.sin(t * 0.0014) * (radius * 0.05);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    /* ---------- Camera ---------- */
    let stream = null;
    async function startCamera(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        flash("This browser can't open the camera. If you came from inside another app, open this link in Safari/Chrome directly."); return false;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      } catch (e1){
        try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
        catch (e2){
          const n = e2 && e2.name;
          if (n === 'NotAllowedError') flash('Camera blocked. Allow it in your browser settings, then reload. (You can still see the logo above.)', 6000);
          else flash('Camera error: ' + (n || e2), 6000);
          return false;
        }
      }
      camEl.srcObject = stream;
      try { await camEl.play(); } catch(e){}
      return true;
    }
    function stopCamera(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; camEl.srcObject = null; } }

    /* ---------- Native AR (real surface tracking) ---------- */
    const mv = document.getElementById('mv');
    const tableBtn = document.getElementById('tableBtn');
    const arnote = document.getElementById('arnote');

    customElements.whenDefined('model-viewer').then(() => {
      const update = () => {
        arnote.textContent = mv.canActivateAR
          ? 'Point your phone at a table or floor, then move it around'
          : 'Open this page on an iPhone or Android phone to place it in AR';
      };
      update();
      mv.addEventListener('load', update);
      mv.addEventListener('ar-status', update);
      setTimeout(update, 1000);
    });

    // Primary: drop the logo onto a real surface via the OS (ARKit / ARCore).
    tableBtn.addEventListener('click', () => {
      if (mv && mv.canActivateAR) {
        stopCamera();          // release the camera so ARKit/ARCore can use it
        mv.activateAR();
      } else {
        flash('Native AR isn’t available on this device. Open vfx.productions/business-card on a recent iPhone (Safari) or Android (Chrome) to place the logo on your table or floor.', 8000);
      }
    });

    /* ---------- Secondary: logo composited over the live camera ---------- */
    document.getElementById('launchBtn').addEventListener('click', async () => {
      intro.classList.add('hidden'); hideC(foot); topbar.classList.add('show');
      const ok = await startCamera();
      if (ok) { show(hint); setTimeout(()=>hideC(hint), 4500); }
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      stopCamera(); topbar.classList.remove('show'); hideC(hint); toast.classList.remove('show');
      intro.classList.remove('hidden'); show(foot);
    });
  </script>
</body>
</html>
