<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VFX · Test 2 — bare MindAR (camera + tracking)</title>
<!-- Canonical MindAR setup. No custom CSS, no overlay, no custom renderer/transparency. -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0}</style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: yes; uiError: no"
    color-space="sRGB" embedded
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" intensity="0.8" position="0 1 1"></a-light>
      <a-gltf-model src="./assets/logo.glb" rotation="90 0 0" position="0 0 0.05" scale="0.3 0.3 0.3"></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
