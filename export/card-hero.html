<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    letter-spacing:.02em;
    -webkit-font-smoothing: antialiased;
    color: rgba(240,240,250,1);
  }

  /* exact site values */
  .stage{
    width: 760px;
    padding: 64px 60px;
    background:#000;
  }
  .copy{ max-width: 640px; }

  .kicker{
    font-size:.85rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: rgba(240,240,250,.8);
    margin-bottom:12px;
  }

  .hero-svg-title{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    overflow:visible;
    margin-bottom:8px;
  }

  .sub{
    margin-top:14px;
    max-width:56ch;
    font-size:1.05rem;
    line-height:1.6;
    color: rgba(240,240,250,.8);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="kicker">Vision for Xperiences</div>
      <svg class="hero-svg-title" viewBox="0 0 750 295"
           preserveAspectRatio="xMinYMid meet" overflow="visible"
           xmlns="http://www.w3.org/2000/svg">
        <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"
           font-weight="900" font-size="90" text-rendering="optimizeLegibility">
          <text x="0" y="90">
            <tspan fill="#fff">V</tspan><tspan fill="none" stroke="#fff" stroke-width="1.4" letter-spacing="2" paint-order="stroke fill">ISION</tspan>
          </text>
          <text x="0" y="188">
            <tspan fill="#fff">F</tspan><tspan fill="none" stroke="#fff" stroke-width="1.4" letter-spacing="2" paint-order="stroke fill">OR</tspan>
          </text>
          <text x="0" y="286">
            <tspan fill="#fff">X</tspan><tspan fill="none" stroke="#fff" stroke-width="1.4" letter-spacing="2" paint-order="stroke fill">PERIENCES.</tspan>
          </text>
        </g>
      </svg>
      <p class="sub">
        We design experiences that hit: cinematic VFX, high-end 3D animation, live visuals, and interactive tech.
        From festival stages to corporate keynotes — you name it, we build it.
      </p>
    </div>
  </div>
</body>
</html>
